<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JukeBar Soirée Ricard</title>
    <link rel="icon" href="asset/logo.png">
    
    <!-- Lier le fichier CSS externe -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Script JS chargé avec defer -->
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <a href="index.html">
            <img class="logo-accueil" alt="Le JukeBar" src="asset/logo.png">
        </a>
    </header>

    <main>
        <!-- Galerie d'images -->
        <div class="gallery">
            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/1.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/2.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/3.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/4.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/5.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/6.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/7.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/8.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/9.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>

            <div class="gallery-item">
                <div class="img-container">
                    <img src="photo/ricard/10.png" class="gallery-img" alt="Soirée du 26/09/26">
                </div>
            </div>
        </div>

        <!-- Boîte modale unique pour le zoom -->
        <dialog id="lightbox">
            <div class="lightbox-content">
                <button id="close-btn" class="close-btn">&times;</button>
                <button id="prev-btn" class="nav-btn prev-btn">&#10094;</button>
                <!-- <a id="downloadBtn" href="" download class="download-btn" title="Télécharger la photo">
    ⬇           </a> -->
                <img id="lightbox-img" src="" alt="Photo agrandie">
                
                <button id="next-btn" class="nav-btn next-btn">&#10095;</button>
            </div>
        </dialog>

        <footer>
            <div class="footer-bandeau">
                <a class="instagram-link" href="https://www.instagram.com/lejukebar/">
                    <img alt="instagram" src="asset/insta.png">
                </a>
                <div class="txt-footer">
                    258 rue de Bourgogne Orléans
                </div>
                <div class="txt-footer">
                    Made In lejukebar
                </div>
                <button id="backToTop" title="Retourner en haut">↑</button>
            </div>
        </footer>
    </main>

</body>
</html>
